[project]
name = "git-tree"
version = "0.1.0"
description = "Cascading rebase tool for branch dependency chains"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Garrett Goon", email = "garrettgoon@duck.com" }]

[project.urls]
Homepage = "https://github.com/garrett361/git_tree"
Repository = "https://github.com/garrett361/git_tree"

[project.scripts]
git-tree = "git_tree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# ruff's formatter output can change across minor versions, so pin it tightly
# to keep formatting identical on every machine (the lockfile pins it exactly).
dev = ["pytest>=8", "ruff>=0.15,<0.16", "ty>=0.0.51,<0.1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["git_tree"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TCH"]
# The command-module imports there exist to run their @subcommand decorators, not to re-export.
"git_tree/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"
